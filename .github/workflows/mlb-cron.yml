# MLB sync without continuous polling.
# Import new markets, close started games, and resolve finished ones
# a few times per day — enough for payouts soon after games end and
# new listings soon after they appear on Polymarket.
#
# Requires repo secrets: CRON_SECRET, VERCEL_APP_URL (e.g. https://ennustamo.vercel.app)
# Vercel Hobby crons remain once-daily backups (see vercel.json).

name: MLB cron

on:
  schedule:
    # Every 3 hours (UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  mlb-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Import, close, resolve MLB markets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "VERCEL_APP_URL secret missing — skip"
            exit 0
          fi
          AUTH_HEADER=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          BASE="${APP_URL%/}"
          echo "→ mlb-import"
          curl -fsS "${AUTH_HEADER[@]}" "${BASE}/api/cron/mlb-import" | tee /tmp/import.json
          echo "→ mlb-odds (close at game start)"
          curl -fsS "${AUTH_HEADER[@]}" "${BASE}/api/cron/mlb-odds" | tee /tmp/odds.json
          echo "→ mlb-resolve"
          curl -fsS "${AUTH_HEADER[@]}" "${BASE}/api/cron/mlb-resolve" | tee /tmp/resolve.json
